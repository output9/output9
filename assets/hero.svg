<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Siddharth Umathe Applied AI Engineer">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e11"/>
      <stop offset="1" stop-color="#111419"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d7ff5f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d7ff5f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#fade)"/>
  <g opacity=".08" stroke="#ffffff" stroke-width="1">
    <path d="M0 66H1200M0 132H1200M0 198H1200M0 264H1200"/>
    <path d="M120 0V330M240 0V330M360 0V330M480 0V330M600 0V330M720 0V330M840 0V330M960 0V330M1080 0V330"/>
  </g>
  <circle cx="1020" cy="96" r="176" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1020" cy="96" r="104" fill="none" stroke="#d7ff5f" stroke-opacity=".16"/>
  <circle cx="1020" cy="96" r="150" fill="none" stroke="#d7ff5f" stroke-opacity=".08"/>
  <path id="orbit" d="M870 96a150 150 0 1 0 300 0a150 150 0 1 0 -300 0" fill="none"/>
  <circle r="6" fill="#d7ff5f">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
  </circle>
  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="76" fill="#9aa3ad" font-size="20" letter-spacing="4">APPLIED AI ENGINEER  |  IIT MADRAS</text>
    <text x="70" y="155" fill="#f4f6f8" font-size="64" font-weight="700" letter-spacing="-2">SIDDHARTH UMATHE</text>
    <text x="70" y="205" fill="#d7ff5f" font-size="27" font-weight="600">I build AI systems that research, reason, retrieve, evaluate and ship.</text>
    <text x="70" y="265" fill="#9aa3ad" font-size="18">Agents  |  RAG  |  Speech  |  Multimodal AI  |  Computer Vision</text>
  </g>
  <rect x="0" y="0" width="0" height="4" fill="#d7ff5f">
    <animate attributeName="width" values="0;1200;1200;0" keyTimes="0;0.55;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>